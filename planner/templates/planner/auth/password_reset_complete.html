{% extends "planner/_base_public.html" %}
{% block title %}Password changed · DevPlanner{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-6 py-16">
  <h1 class="text-2xl font-bold text-white">Password changed</h1>
  <p class="mt-2 text-sm text-slate-400">
    Your password has been updated. You can now log in with your new password.
  </p>
  <a href="{% url 'planner:login' %}" class="mt-6 inline-flex justify-center items-center rounded-md bg-indigo-600 px-5 py-2.5 font-semibold text-white hover:bg-indigo-500">
    Log in
  </a>
</section>
{% endblock %}
