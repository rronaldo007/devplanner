{% load static %}<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DevPlanner{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <style type="text/tailwindcss">
    @layer base {
      body { font-family: 'Inter', system-ui, sans-serif; }
    }
    @layer components {
      .field input[type="text"],
      .field input[type="email"],
      .field input[type="password"],
      .field input[type="number"],
      .field input[type="url"],
      .field textarea,
      .field select {
        @apply w-full rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-slate-100 placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500;
      }
      .field textarea { @apply font-mono text-sm; }
      .field label { @apply block text-sm font-medium text-slate-200 mb-1; }
      .field .hint { @apply mt-1 text-xs text-slate-400; }
      .field .errors { @apply mt-1 text-xs text-red-400; }
      .field ul { @apply mt-1 text-xs text-slate-400 list-disc pl-5; }

      /* Show/hide password toggle (injected around every password input). */
      .pw-wrap { @apply relative block; }
      .pw-wrap input { @apply pr-10; }
      .pw-toggle { @apply absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-slate-200 focus:outline-none focus:text-indigo-400; }
      .pw-toggle svg { @apply h-5 w-5; }

      .markdown h1 { @apply text-2xl font-bold mt-0 mb-3 text-slate-100; }
      .markdown h2 { @apply text-xl font-semibold mt-6 mb-2 text-slate-100; }
      .markdown h3 { @apply text-lg font-semibold mt-4 mb-2 text-slate-100; }
      .markdown p  { @apply my-2 text-slate-300 leading-relaxed; }
      .markdown ul { @apply list-disc pl-6 my-2 text-slate-300; }
      .markdown ol { @apply list-decimal pl-6 my-2 text-slate-300; }
      .markdown li { @apply my-1; }
      .markdown code { @apply bg-slate-950 px-1.5 py-0.5 rounded text-indigo-300 text-sm; }
      .markdown pre { @apply bg-slate-950 p-3 rounded-md my-3 overflow-x-auto; }
      .markdown blockquote { @apply border-l-2 border-slate-600 pl-3 italic text-slate-400 my-2; }
      .markdown strong { @apply text-slate-100; }
      .markdown a { @apply text-indigo-400 hover:underline; }
    }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased">
  {% block body %}{% endblock %}

  <script>
    // Add a show/hide ("see") toggle to every password input on the page.
    (function () {
      var EYE = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>';
      var EYE_OFF = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>';

      function addToggle(input) {
        if (input.dataset.pwToggle) return;       // already wired
        input.dataset.pwToggle = '1';

        var wrap = document.createElement('span');
        wrap.className = 'pw-wrap';
        input.parentNode.insertBefore(wrap, input);
        wrap.appendChild(input);

        var btn = document.createElement('button');
        btn.type = 'button';                       // never submit the form
        btn.className = 'pw-toggle';
        btn.setAttribute('aria-label', 'Show password');
        btn.innerHTML = EYE;
        wrap.appendChild(btn);

        btn.addEventListener('click', function () {
          var reveal = input.type === 'password';
          input.type = reveal ? 'text' : 'password';
          btn.innerHTML = reveal ? EYE_OFF : EYE;
          btn.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
        });
      }

      document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('input[type="password"]').forEach(addToggle);
      });
    })();
  </script>
</body>
</html>
