{% if docs %}
<section class="mt-8">
  <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">{{ title }}</h2>
  <div class="mt-3 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
    {% for document in docs %}
      <a href="{% url 'planner:document_detail' document.project.pk document.pk %}" class="group rounded-lg border border-slate-800 bg-slate-900/50 p-4 hover:border-indigo-500 hover:bg-slate-900 transition">
        <div class="flex items-start gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-lg
            {% if document.is_diagram %}bg-emerald-500/15 text-emerald-300
            {% elif document.kind == 'custom' %}bg-amber-500/15 text-amber-300
            {% else %}bg-indigo-500/15 text-indigo-300{% endif %}">
            {% if document.is_diagram %}🧭{% elif document.kind == 'custom' %}📄{% else %}📘{% endif %}
          </div>
          <div class="min-w-0 flex-1">
            <h3 class="truncate font-semibold text-white group-hover:text-indigo-300">{{ document.title }}</h3>
            <p class="mt-0.5 text-xs text-slate-500">{{ document.get_kind_display }}</p>
            <p class="mt-2 text-xs text-slate-500">{{ document.updated_at|date:"M j, Y H:i" }}</p>
          </div>
        </div>
      </a>
    {% endfor %}
  </div>
</section>
{% endif %}
