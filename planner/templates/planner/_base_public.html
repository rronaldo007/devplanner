{% extends "planner/base.html" %}

{% block body %}
<div class="min-h-full flex flex-col">
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-10">
    <div class="max-w-6xl mx-auto flex items-center justify-between px-6 py-4">
      <a href="{% url 'planner:home' %}" class="flex items-center gap-2 text-lg font-bold text-white">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-white font-black">D</span>
        DevPlanner
      </a>
      <nav class="flex items-center gap-2 text-sm">
        <a href="{% url 'planner:home' %}" class="px-3 py-2 text-slate-300 hover:text-white">Home</a>
        <a href="{% url 'planner:about' %}" class="px-3 py-2 text-slate-300 hover:text-white">About</a>
        {% if user.is_authenticated %}
          <a href="{% url 'planner:dashboard' %}" class="ml-2 inline-flex items-center rounded-md bg-indigo-600 px-4 py-2 font-semibold text-white hover:bg-indigo-500">Dashboard</a>
        {% else %}
          <a href="{% url 'planner:login' %}" class="px-3 py-2 text-slate-300 hover:text-white">Log in</a>
          <a href="{% url 'planner:register' %}" class="ml-2 inline-flex items-center rounded-md bg-indigo-600 px-4 py-2 font-semibold text-white hover:bg-indigo-500">Sign up</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-slate-800 mt-12">
    <div class="max-w-6xl mx-auto px-6 py-6 text-sm text-slate-500 flex flex-wrap justify-between gap-2">
      <span>DevPlanner · prepare your idea before writing a line of code.</span>
      <span>© DevPlanner</span>
    </div>
  </footer>
</div>
{% endblock %}
